<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D将棋 — Animation Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div><p class="eyebrow">3D SHOGI / MOTION REVIEW</p><h1>Animation Gallery</h1>
  <p class="lede">ゲーム本体とは独立した、駒モデルのモーション確認用ギャラリーです。各駒の攻撃・被弾・撃破・復帰までを連続して確認でき、王のBoss大技は独立カードで掲載しています。<b>0.25× / 0.5×</b> のスロー再生にも対応しています。</p></div>
  <div class="controls"><div class="speeds" aria-label="再生速度"><button data-speed="0.25">0.25×</button><button data-speed="0.5">0.5×</button><button data-speed="1" class="active">1×</button></div><button id="toggleAll">一時停止</button></div>
</header>
<main>
<section class="grid" id="gallery"></section>
</main>
<footer>Blender motion preview / Gameplay Scene・Prefabとは分離</footer>
<script src="app.js"></script>
</body></html>
