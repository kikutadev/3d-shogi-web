<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D将棋 — Animation & VFX Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div>
    <p class="eyebrow">3D SHOGI / ANIMATION + VFX REVIEW</p>
    <h1>Animation Gallery</h1>
    <p class="lede">駒ごとのアニメーションとゲーム内エフェクトを同じ場所で確認するレビューギャラリーです。全駒の現行アニメーションを個別カードで表示しています。歩兵は <b>Animator State 15件を全件表示</b>。その他7駒も既存シーケンスを <b>Idle / Move / Attack / Hit / Defeated / Revive</b> に分割し、VFXの有無も明示しています。</p>
  </div>
  <div class="controls">
    <div class="speeds" aria-label="再生速度"><button data-speed="0.25">0.25×</button><button data-speed="0.5">0.5×</button><button data-speed="1" class="active">1×</button></div>
    <button id="toggleAll">一時停止</button>
  </div>
</header>
<main>
  <section class="coverage" id="coverage"></section>
  <nav class="filters" id="filters" aria-label="表示フィルタ"></nav>
  <div id="gallery"></div>
</main>
<footer>Animation state + Presentation VFX review / Gameplay logicとは分離</footer>
<script src="app.js?v=58"></script>
</body></html>
